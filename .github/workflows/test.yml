name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - name: Verify AI Gate scripts are executable
        run: |
          test -x examples/ai/apply-authority-fixture-acls.sh
          test -x examples/ai/authority-separation-gate.sh
          test -x examples/ai/validator-vault-access-gate.sh
          test -x examples/ai/shared-production-lock-gate.sh
          test -x examples/ai/reader-context-boundary-gate.sh
          test -x examples/ai/reader-vault-traversal-gate.sh
      - run: bash -n examples/ai/apply-authority-fixture-acls.sh examples/ai/authority-separation-gate.sh examples/ai/validator-vault-access-gate.sh examples/ai/shared-production-lock-gate.sh examples/ai/reader-context-boundary-gate.sh examples/ai/reader-vault-traversal-gate.sh
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q

  authority-fixture:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y acl
      - name: Run consolidated authority provisioner twice
        run: |
          sudo python3 tools/provision_automation_authority.py > /tmp/authority-first.json
          sudo python3 tools/provision_automation_authority.py > /tmp/authority-second.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          for name in ("authority-first.json", "authority-second.json"):
              value = json.loads((Path("/tmp") / name).read_text())
              assert value["status"] == "completed"
              assert value["result"] == "passed"
              assert value["credentials_installed"] is False
              assert value["systemd_units_installed"] is False
              assert value["recurring_services_activated"] is False
          print("PASS: consolidated authority provisioning is idempotent")
          PY
      - name: Verify authority fixture users
        run: |
          for user in \
            obsidian-ai-sync \
            obsidian-ai-reader \
            obsidian-ai-generator \
            obsidian-ai-validator \
            obsidian-ai-evaluator \
            obsidian-ai-status \
            obsidian-ai-reviewer \
            obsidian-ai-executor
          do
            id "$user"
          done
      - name: Run separate Vault/state Authority separation Gate
        run: |
          sudo install -d -m 0700 /tmp/obsidian-ai-vault-fixture
          sudo touch /tmp/obsidian-ai-vault-fixture/.obsidian-ai-disposable-fixture
          sudo install -d -m 0700 /tmp/obsidian-ai-state-fixture
          sudo touch /tmp/obsidian-ai-state-fixture/.obsidian-ai-disposable-state
          sudo env \
            VAULT_ROOT=/tmp/obsidian-ai-vault-fixture \
            AI_ROOT=/tmp/obsidian-ai-state-fixture \
            bash examples/ai/apply-authority-fixture-acls.sh
          sudo env \
            AI_ROOT=/tmp/obsidian-ai-state-fixture \
            bash examples/ai/bootstrap-pre-review-authority.sh
          sudo env \
            VAULT_ROOT=/tmp/obsidian-ai-vault-fixture \
            AI_ROOT=/tmp/obsidian-ai-state-fixture \
            bash examples/ai/authority-separation-gate.sh
          sudo env \
            VAULT_ROOT=/tmp/obsidian-ai-vault-fixture \
            AI_ROOT=/tmp/obsidian-ai-state-fixture \
            bash examples/ai/reader-context-boundary-gate.sh
          sudo env \
            VAULT_ROOT=/tmp/obsidian-ai-vault-fixture \
            AI_ROOT=/tmp/obsidian-ai-state-fixture \
            REPO_ROOT="$GITHUB_WORKSPACE" \
            bash examples/ai/reader-vault-traversal-gate.sh
          sudo env \
            VAULT_ROOT=/tmp/obsidian-ai-vault-fixture \
            bash examples/ai/validator-vault-access-gate.sh
          sudo env \
            AI_ROOT=/tmp/obsidian-ai-state-fixture \
            REPO_ROOT="$GITHUB_WORKSPACE" \
            bash examples/ai/shared-production-lock-gate.sh
