name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - name: Verify AI Gate scripts are executable
        run: |
          test -x examples/ai/apply-authority-fixture-acls.sh
          test -x examples/ai/authority-separation-gate.sh
          test -x examples/ai/validator-vault-access-gate.sh
          test -x examples/ai/shared-production-lock-gate.sh
          test -x examples/ai/reader-context-boundary-gate.sh
          test -x examples/ai/reader-vault-traversal-gate.sh
          test -x examples/ai/pre-review-authority-upgrade-gate.sh
      - run: bash -n examples/ai/apply-authority-fixture-acls.sh examples/ai/authority-separation-gate.sh examples/ai/validator-vault-access-gate.sh examples/ai/shared-production-lock-gate.sh examples/ai/reader-context-boundary-gate.sh examples/ai/reader-vault-traversal-gate.sh examples/ai/pre-review-authority-upgrade-gate.sh
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      # Keep existing pytest check names; gate the otherwise unexercised
      # R3 B3 phase/legacy browser assertions on both matrix versions.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: B3 status / browser synthetic regression (GET-only)
        run: |
          set -euo pipefail
          node --test \
            tests/status_manager_history.test.cjs \
            tests/webui_design_v1.test.cjs \
            tests/webui_live_v1.test.cjs \
            tests/status_manager_b3_phase_status.test.cjs

  root-stage-fixtures:
    # These tests require euid=0 to exercise the real root-mode admission
    # branches, but exclusively use tmp_path + a FakeRunner. No systemctl,
    # production path, real Writer or network effect is called by the fixtures.
    # This separate job prevents a green nonroot matrix from hiding SKIPs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Refuse fork PR before checkout or privileged simulation
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo '::error::Fork PR requires a separately reviewed trusted root-fixture run'
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Run exact root-mode Stage and Activate simulations
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          sudo -n env PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" -c 'import os; assert os.geteuid() == 0, "expected root CI fixture"'
          sudo -n env PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" -m pytest -q -rs \
            --junitxml="$RUNNER_TEMP/root-stage-fixtures.xml" \
            tests/test_github_production_staging.py::test_privileged_stage_receipt_binds_backend_then_rechecks_activation \
            tests/test_github_production_staging.py::test_privileged_stage_rejects_root_owned_external_pth_before_effect \
            tests/test_github_production_staging.py::test_privileged_stage_receipt_activates_only_with_simulated_consent
          "$PY" - "$RUNNER_TEMP/root-stage-fixtures.xml" <<'PY'
          import sys
          from xml.etree import ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          total = lambda field: sum(int(s.attrib.get(field, 0)) for s in suites)
          assert total("tests") == 3, "root-mode fixture count differs"
          assert all(total(k) == 0 for k in ("failures", "errors", "skipped")), "root-mode fixture was skipped or failed"
          print("PASS: all three root-mode Stage/Activate fixtures executed")
          PY
      - name: Run disposable cross-UID Owner IPC fixture
        # Source-only B1: no persistent users/services, credentials or live Vault.
        # Requires root solely to spawn an existing different-UID process in
        # an ephemeral /tmp fixture. Reject SKIP, not merely a green job.
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          sudo -n env PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" -m pytest -q -rs \
            --junitxml="$RUNNER_TEMP/owner-listener-crossuid.xml" \
            tests/test_472_owner_listener.py::test_genuine_distinct_uid_worker_claim_and_owner_only_stop \
            tests/test_472_owner_listener.py::test_wrong_parent_group_rejected \
            tests/test_472_owner_listener.py::test_root_fixture_rejects_wrong_parent_owner
          "$PY" - "$RUNNER_TEMP/owner-listener-crossuid.xml" <<'PY'
          import sys
          from xml.etree import ElementTree as ET
          document = ET.parse(sys.argv[1]).getroot()
          suites = (document.findall("testsuite")
                    if document.tag == "testsuites" else [document])
          counts = lambda name: sum(int(s.get(name, 0)) for s in suites)
          assert counts("tests") == 3, "Owner IPC privileged fixture count differs"
          assert all(counts(k) == 0 for k in ("failures", "errors", "skipped")), (
              "cross-UID fixture failed or skipped"
          )
          print("PASS: real different-UID SO_PEERCRED claim and Owner-only stop")
          PY

      - name: Run disposable cross-UID Worker Client fixture
        # D0 is source-only. Root is confined to the pre-existing disposable
        # test runner; fork PRs are refused earlier, before checkout.
        # Require one genuinely executed non-skipped test, not an empty green.
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          sudo -n env PYTHONPATH="$GITHUB_WORKSPACE/src" "$PY" -m pytest -q -rs \
            --junitxml="$RUNNER_TEMP/worker-client-crossuid.xml" \
            tests/test_472_worker_ipc_client.py::test_root_real_distinct_uid_worker_client_claim_and_status
          "$PY" - "$RUNNER_TEMP/worker-client-crossuid.xml" <<'PY'
          import sys
          from xml.etree import ElementTree as ET
          doc = ET.parse(sys.argv[1]).getroot()
          suites = (doc.findall("testsuite")
                    if doc.tag == "testsuites" else [doc])
          counts = lambda k: sum(int(s.get(k, 0)) for s in suites)
          assert counts("tests") == 1, "D0 fixture missing/extra tests"
          assert all(counts(k) == 0 for k in ("failures", "errors", "skipped")), (
              "D0 cross-UID fixture failed or skipped"
          )
          print("PASS: real separate-UID Worker client Claim/Status, no replay")
          PY

  authority-fixture:
    # #410: Independent production-reference + new-host-OS ACL qualification.
    # Preserve all allow/deny and fail-closed gates on both distributions.
    # This matrix is a test-only candidate: matrix job names may affect
    # branch-protection required-check configuration on future integration.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    permissions:
      contents: read

    steps:
      - name: Refuse fork PR before checkout or privileged authority fixtures
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo '::error::Fork PR requires separately reviewed privileged authority fixtures'
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y acl
      - name: Run consolidated authority provisioner twice
        run: |
          sudo python3 tools/provision_automation_authority.py > /tmp/authority-first.json
          sudo python3 tools/provision_automation_authority.py > /tmp/authority-second.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          for name in ("authority-first.json", "authority-second.json"):
              value = json.loads((Path("/tmp") / name).read_text())
              assert value["status"] == "completed"
              assert value["result"] == "passed"
              assert value["credentials_installed"] is False
              assert value["systemd_units_installed"] is False
              assert value["recurring_services_activated"] is False
          print("PASS: consolidated authority provisioning is idempotent")
          PY
      - name: Verify authority fixture users
        run: |
          for user in \
            obsidian-ai-sync \
            obsidian-ai-reader \
            obsidian-ai-embedder \
            obsidian-ai-generator \
            obsidian-ai-validator \
            obsidian-ai-evaluator \
            obsidian-ai-status \
            obsidian-ai-reviewer \
            obsidian-ai-executor
          do
            id "$user"
          done
      - name: Exercise private config stream transfer and readability gates
        run: |
          set -o pipefail
          SRC=/tmp/private-config-source

          sudo install -d -m 0700 "$SRC"

          write_private() {
            path="$1"
            sudo install -d -m 0700 "$SRC$(dirname "$path")"
            printf '%s\n' 'PRIVATE-MIGRATION-CANARY-never-print-this' \
              | sudo tee "$SRC$path" >/dev/null
          }

          for path in \
            /etc/obsidian-core-promotion/promotion.env \
            /etc/obsidian-core-promotion/public-export.toml \
            /etc/obsidian-core-promotion/nextcloud.password \
            /etc/obsidian-ai/rclone.conf \
            /etc/obsidian-ai/webdav-password \
            /etc/obsidian-ai/projection-cleanup.env \
            /etc/obsidian-ai/projection-cleanup-password \
            /etc/obsidian-ai/pre-review-generator.env \
            /etc/obsidian-ai/pre-review-evaluator.env \
            /etc/obsidian-ai/review-intake.env \
            /etc/obsidian-ai/review-intake-password \
            /etc/obsidian-github-sync/config.toml \
            /etc/obsidian-github-sync/credentials.env \
            /etc/obsidian-github-mirror/rclone.conf \
            /etc/obsidian-github-mirror/vault-pull.filters \
            /etc/obsidian-github-writer/config.env \
            /etc/obsidian-github-writer/webdav-password
          do
            write_private "$path"
          done

          for role in publisher ai github-sync
          do
            sudo python3 tools/private_config_transfer.py export \
              --role "$role" \
              --source-root "$SRC" \
              | sudo python3 tools/private_config_transfer.py install \
                  --role "$role" \
                  > "/tmp/$role-install.json"

            sudo python3 tools/private_config_transfer.py verify \
              --role "$role" \
              > "/tmp/$role-verify.json"

            # Retry must converge without replacing differing secret bytes.
            sudo python3 tools/private_config_transfer.py export \
              --role "$role" \
              --source-root "$SRC" \
              | sudo python3 tools/private_config_transfer.py install \
                  --role "$role" \
                  > "/tmp/$role-install-replay.json"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          canary = "PRIVATE-MIGRATION-CANARY-never-print-this"
          for path in Path("/tmp").glob("*-install*.json"):
              raw = path.read_text()
              assert canary not in raw
              value = json.loads(raw)
              assert value["status"] == "completed"
              assert value["values_printed"] is False

          for path in Path("/tmp").glob("*-verify.json"):
              raw = path.read_text()
              assert canary not in raw
              value = json.loads(raw)
              assert value["status"] == "completed"
              assert value["result"] == "passed"
              assert value["values_printed"] is False

          print("PASS: private config transfer is narrow, idempotent, and value-free")
          PY
      - name: Run separate Vault/state Authority separation Gate
        run: |
          sudo install -d -m 0700 /tmp/obsidian-ai-vault-fixture
          sudo touch /tmp/obsidian-ai-vault-fixture/.obsidian-ai-disposable-fixture
          sudo install -d -m 0700 /tmp/obsidian-ai-state-fixture
          sudo touch /tmp/obsidian-ai-state-fixture/.obsidian-ai-disposable-state
          sudo env \
            VAULT_ROOT=/tmp/obsidian-ai-vault-fixture \
            AI_ROOT=/tmp/obsidian-ai-state-fixture \
            bash examples/ai/apply-authority-fixture-acls.sh
          sudo env \
            AI_ROOT=/tmp/obsidian-ai-state-fixture \
            bash examples/ai/bootstrap-pre-review-authority.sh
          sudo env \
            VAULT_ROOT=/tmp/obsidian-ai-vault-fixture \
            AI_ROOT=/tmp/obsidian-ai-state-fixture \
            bash examples/ai/authority-separation-gate.sh
          sudo env \
            VAULT_ROOT=/tmp/obsidian-ai-vault-fixture \
            AI_ROOT=/tmp/obsidian-ai-state-fixture \
            bash examples/ai/reader-context-boundary-gate.sh
          sudo env \
            VAULT_ROOT=/tmp/obsidian-ai-vault-fixture \
            AI_ROOT=/tmp/obsidian-ai-state-fixture \
            REPO_ROOT="$GITHUB_WORKSPACE" \
            bash examples/ai/reader-vault-traversal-gate.sh
          sudo env \
            VAULT_ROOT=/tmp/obsidian-ai-vault-fixture \
            bash examples/ai/validator-vault-access-gate.sh
          sudo env \
            AI_ROOT=/tmp/obsidian-ai-state-fixture \
            REPO_ROOT="$GITHUB_WORKSPACE" \
            bash examples/ai/shared-production-lock-gate.sh
      - name: Run pre-review authority upgrade migration Gate
        run: |
          sudo rm -rf /tmp/obsidian-ai-upgrade-vault /tmp/obsidian-ai-upgrade-state
          sudo env \
            VAULT_ROOT=/tmp/obsidian-ai-upgrade-vault \
            AI_ROOT=/tmp/obsidian-ai-upgrade-state \
            REPO_ROOT="$GITHUB_WORKSPACE" \
            bash examples/ai/pre-review-authority-upgrade-gate.sh
