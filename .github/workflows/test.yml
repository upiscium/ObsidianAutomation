name: Three-Service Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  minimal-workflows:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install three-service source and synthetic tests
        run: python -m pip install -e '.[dev]'
      - name: Check UI syntax and stale-result rendering
        run: |
          node --check src/obsidian_automation/three_services/app.js
          node --check src/obsidian_automation/three_services/chat-import.js
          node --test tests/three_services_ui.test.cjs tests/chat_import_ui.test.cjs tests/knowledge_ui.test.cjs
      - name: Run offline synthetic and HTTP tests
        run: python -m pytest -q
