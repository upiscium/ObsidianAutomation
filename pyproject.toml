[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-automation"
version = "0.1.0"
description = "Deterministic automation tools for safely maintaining and publishing Obsidian Vaults."
requires-python = ">=3.11"

[project.scripts]
obsidian-public-export = "obsidian_automation.public_export:main"
obsidian-public-publish = "obsidian_automation.public_publish:main"
obsidian-vault-snapshot = "obsidian_automation.vault_snapshot_cli:main"
obsidian-webdav-create = "obsidian_automation.webdav_create:main"
obsidian-core-promotion-plan = "obsidian_automation.core_promotion:plan_main"
obsidian-core-promotion-reconcile = "obsidian_automation.core_promotion:reconcile_main"
obsidian-core-promotion-checkpoint-init = "obsidian_automation.core_promotion_checkpoint:main"
obsidian-core-promotion-transport = "obsidian_automation.core_promotion_transport:main"
obsidian-core-promotion-bootstrap = "obsidian_automation.promotion_bootstrap:main"
obsidian-core-promotion-run = "obsidian_automation.managed_promotion_deployment:main"
obsidian-knowledge-context = "obsidian_automation.context_bundle:main"
obsidian-knowledge-index = "obsidian_automation.knowledge_index:index_main"
obsidian-knowledge-retrieve = "obsidian_automation.context_selection:main"
obsidian-knowledge-retrieval-eval = "obsidian_automation.retrieval_eval:main"
obsidian-knowledge-generate = "obsidian_automation.ollama_generator:main"
obsidian-knowledge-validator = "obsidian_automation.knowledge_validator:main"
obsidian-knowledge-evaluation-request = "obsidian_automation.evaluation_artifact:request_main"
obsidian-knowledge-evaluation-context = "obsidian_automation.evaluation_artifact:context_main"
obsidian-knowledge-evaluate = "obsidian_automation.ollama_evaluator:main"
obsidian-knowledge-review = "obsidian_automation.knowledge_review:main"
obsidian-pre-review-job = "obsidian_automation.pre_review_job:main"
obsidian-pre-review-generator-worker = "obsidian_automation.pre_review_worker:generator_main"
obsidian-pre-review-validator-worker = "obsidian_automation.pre_review_worker:validator_main"
obsidian-pre-review-reader-worker = "obsidian_automation.pre_review_worker:reader_main"
obsidian-pre-review-evaluator-worker = "obsidian_automation.pre_review_worker:evaluator_main"
obsidian-pre-review-status-project = "obsidian_automation.pre_review_status:project_main"
obsidian-pre-review-status = "obsidian_automation.pre_review_status:main"
obsidian-pre-review-production-smoke = "obsidian_automation.pre_review_production_smoke:main"
obsidian-pre-review-production-update = "obsidian_automation.pre_review_production_update:main"
obsidian-pre-review-production-canary = "obsidian_automation.pre_review_production_canary:main"
obsidian-production-executor = "obsidian_automation.production_orchestrator:executor_main"
obsidian-production-webdav-worker = "obsidian_automation.production_orchestrator:worker_main"
obsidian-production-knowledge-executor = "obsidian_automation.knowledge_production:executor_main"
obsidian-production-knowledge-webdav-worker = "obsidian_automation.knowledge_production:worker_main"
obsidian-production-vault-pull = "obsidian_automation.vault_mirror:main"
obsidian-github-project-watch = "obsidian_automation.github_project_watcher_runtime:main"
obsidian-github-project-watch-enqueue = "obsidian_automation.github_project_status_queue:main"
obsidian-github-project-status-apply = "obsidian_automation.github_project_status_mutation:main"
obsidian-github-project-status-worker = "obsidian_automation.github_project_status_worker:main"
obsidian-github-project-status-compact = "obsidian_automation.github_project_status_compactor:main"
obsidian-github-project-overview-enqueue = "obsidian_automation.github_project_overview_queue:main"
obsidian-github-project-overview-worker = "obsidian_automation.github_project_overview_worker:main"
obsidian-github-production-smoke = "obsidian_automation.github_production_smoke:main"
obsidian-github-production-update = "obsidian_automation.github_production_update:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
