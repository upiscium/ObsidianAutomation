[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-automation"
version = "0.1.0"
description = "Deterministic automation tools for safely maintaining and publishing Obsidian Vaults."
requires-python = ">=3.11"

[project.scripts]
# One app provides all three operator controls. The remaining CLIs support
# the existing Gitea publication bridge and safe Core Promotion recovery.
obsidian-snapshot-app = "obsidian_automation.snapshot_app:main"
obsidian-public-export = "obsidian_automation.public_export:main"
obsidian-public-publish = "obsidian_automation.public_publish:main"
obsidian-core-promotion-bootstrap = "obsidian_automation.promotion_bootstrap:main"
obsidian-core-promotion-run = "obsidian_automation.managed_promotion_deployment:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obsidian_automation = ["three_services/*.html", "three_services/*.js", "three_services/*.css", "three_services/*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
