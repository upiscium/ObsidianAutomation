[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-automation"
version = "0.1.0"
description = "Deterministic automation tools for safely maintaining and publishing Obsidian Vaults."
requires-python = ">=3.11"

[project.scripts]
obsidian-public-export = "obsidian_automation.public_export:main"
obsidian-public-publish = "obsidian_automation.public_publish:main"
obsidian-vault-snapshot = "obsidian_automation.vault_snapshot_cli:main"
obsidian-webdav-create = "obsidian_automation.webdav_create:main"
obsidian-knowledge-context = "obsidian_automation.context_bundle:main"
obsidian-knowledge-index = "obsidian_automation.knowledge_index:index_main"
obsidian-knowledge-retrieve = "obsidian_automation.context_selection:main"
obsidian-knowledge-retrieval-eval = "obsidian_automation.retrieval_eval:main"
obsidian-knowledge-generate = "obsidian_automation.ollama_generator:main"
obsidian-knowledge-validator = "obsidian_automation.knowledge_validator:main"
obsidian-knowledge-evaluation-request = "obsidian_automation.evaluation_artifact:request_main"
obsidian-knowledge-evaluation-context = "obsidian_automation.evaluation_artifact:context_main"
obsidian-knowledge-evaluate = "obsidian_automation.ollama_evaluator:main"
obsidian-production-executor = "obsidian_automation.production_orchestrator:executor_main"
obsidian-production-webdav-worker = "obsidian_automation.production_orchestrator:worker_main"
obsidian-production-knowledge-executor = "obsidian_automation.knowledge_production:executor_main"
obsidian-production-knowledge-webdav-worker = "obsidian_automation.knowledge_production:worker_main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
